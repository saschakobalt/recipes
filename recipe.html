<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe - BY ALÉ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="logo-text">BY ALÉ</a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.recipes">Recipes</a></li>
      <li><span class="nav-disabled" data-i18n="nav.blog">Blog (WIP)</span></li>
    </ul>
    <div class="header-actions settings-wrapper">
      <div class="settings-shell">
        <button type="button" id="theme-toggle" class="theme-toggle-btn settings-toggle-btn" aria-label="Open settings" data-i18n-aria-label="buttons.settings" aria-expanded="false" aria-controls="settings-popover">
          <span class="material-symbols-outlined" id="theme-icon">settings</span>
        </button>
        <div class="settings-popover" id="settings-popover" role="dialog" aria-label="Settings">
          <div class="settings-group">
            <span class="settings-label" data-i18n="settings.theme">Theme</span>
            <div class="settings-option-grid">
              <button type="button" class="settings-option-btn" data-setting="theme" data-value="light" data-i18n="settings.light">Light</button>
              <button type="button" class="settings-option-btn" data-setting="theme" data-value="dark" data-i18n="settings.dark">Dark</button>
            </div>
          </div>
          <div class="settings-group">
            <span class="settings-label" data-i18n="settings.language">Language</span>
            <div class="settings-option-grid">
              <button type="button" class="settings-option-btn" data-setting="language" data-value="en" data-i18n="settings.english">English</button>
              <button type="button" class="settings-option-btn" data-setting="language" data-value="de" data-i18n="settings.german">Deutsch</button>
              <button type="button" class="settings-option-btn" data-setting="language" data-value="ru" data-i18n="settings.russian">Русский</button>
            </div>
          </div>
          <div class="settings-group">
            <div class="settings-toggle-row">
              <span class="settings-label" data-i18n="settings.highContrast">High Contrast</span>
              <button type="button" class="settings-switch" id="contrast-toggle" data-setting="contrast" aria-pressed="false">
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container recipe-container">
    <div class="recipe-hero">
      <h1 class="recipe-header-title" id="recipe-title"></h1>
      <div class="recipe-header-image">
        <img id="recipe-image" src="" alt="">
      </div>
    </div>

    <div class="meta-box">
      <div class="meta-item">
        <span class="meta-label" data-i18n="recipe.time">Time:</span>
        <span class="meta-value" id="recipe-time"></span>
      </div>
      <div class="meta-item">
        <span class="meta-label" data-i18n="recipe.yield">Yield:</span>
        <span class="meta-value" id="recipe-yield"></span>
      </div>
    </div>

    <button type="button" class="print-recipe-btn" id="print-recipe-btn" aria-label="Print this recipe" data-i18n-aria-label="recipe.print">
      <span class="social-icon" aria-hidden="true">
        <i class="fa-solid fa-print"></i>
      </span>
      <span class="social-text" data-i18n="recipe.printText">Print this recipe</span>
    </button>

    <details class="ingredients-expandable" open>
      <summary class="ingredients-summary">
        <span data-i18n="recipe.ingredients">Ingredients</span>
        <span class="summary-icon">↓</span>
      </summary>
      <ul class="ingredients-list" id="ingredients-list"></ul>
    </details>

    <section class="recipe-instructions">
      <h2 class="instructions-title" data-i18n="recipe.instructions">Instructions</h2>
      <ol class="instructions-list" id="instructions-list"></ol>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="social-links">
        <a class="social-link" href="https://www.instagram.com/saschakobalt" target="_blank" rel="noopener noreferrer" aria-label="Visit Instagram profile">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-brands fa-instagram"></i>
          </span>
          <span class="social-text">Instagram • @saschakobalt</span>
        </a>
        <a class="social-link" href="faq.html" aria-label="Open FAQ page">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-solid fa-circle-question"></i>
          </span>
          <span class="social-text" data-i18n="footer.faq">FAQ</span>
        </a>
        <a class="social-link" href="https://forms.gle/3FCcQHXBFqMiV2AYA" target="_blank" rel="noopener noreferrer" aria-label="Open feedback form">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <span class="social-text" data-i18n="footer.reportProblem">Report a problem • Google Form</span>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
